<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>三国图鉴 · 后台已合并</title>
<style>
:root{--bg:#0c1319;--panel:#121e27;--line:rgba(255,255,255,.09);--txt:#e8eef4;--dim:#8fa3b3;--gold:#f2c14e;--grn:#3fae7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#16303f 0%,transparent 60%),var(--bg);
  color:var(--txt);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:460px;background:linear-gradient(180deg,rgba(24,38,48,.96),rgba(16,26,34,.96));
  border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#b3352b,#6d1a14);display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#f7e6c4;box-shadow:0 2px 10px rgba(179,53,43,.4);margin-bottom:14px}
h1{font-size:17px;margin:0 0 6px;letter-spacing:.04em}
h1 b{color:var(--gold);font-weight:600}
p{margin:0 0 14px;color:var(--dim);font-size:12.5px}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#cfe3f2;
  background:#0b141b;border:1px solid var(--line);border-radius:9px;padding:11px 13px;word-break:break-all;margin-bottom:16px}
a.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(160deg,#f2c14e,#d8a02e);color:#241a08;
  font-weight:600;padding:11px;border-radius:9px;font-size:13.5px}
a.btn:hover{filter:brightness(1.06)}
.hint{margin-top:14px;font-size:11.5px;color:#6c8092;line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grn);margin-right:6px;vertical-align:1px}
.dot.bad{background:#e05b4b}
</style>
</head>
<body>
<div class="card">
  <div class="logo">三國</div>
  <h1>三国图鉴 · <b>后台已合并</b></h1>
  <p>海外站后台与国内站后台已整合为同一套控制台，请从下面的地址进入（账号、发放、日志完全一致）。</p>
  <div class="url" id="target">https://sanguo-atlas.app.workbuddy.host/admin/</div>
  <a class="btn" id="go" href="https://sanguo-atlas.app.workbuddy.host/admin/">进入统一后台</a>
  <div class="hint"><span class="dot" id="dot"></span><span id="state">正在跳转…</span></div>
  <div class="hint">原海外后台地址 <span style="color:#8fa3b3">fanyzou99.github.io/sanguo-admin</span> 已停用，仅保留此跳转页。后台数据只存放在应用域名下的云端数据库，因此控制台也只在应用域名下运行。</div>
</div>
<script>
(function () {
  var TARGET = "https://sanguo-atlas.app.workbuddy.host/admin/";
  var go = document.getElementById("go");
  var state = document.getElementById("state");
  var dot = document.getElementById("dot");
  go.href = TARGET;

  /* 先探测目标是否可解析可达：可达则 1.2s 后自动跳转，不可达则提示稍后再试（避免白屏） */
  var done = false;
  function jump() { if (done) return; done = true; location.replace(TARGET); }
  function probe() {
    return new Promise(function (res) {
      var t = setTimeout(function () { res(false); }, 5000);
      try {
        fetch(TARGET + "sdk.js", { method: "GET", mode: "no-cors", cache: "no-store" }).then(function () {
          clearTimeout(t); res(true);
        }, function () { clearTimeout(t); res(false); });
      } catch (e) { clearTimeout(t); res(false); }
    });
  }
  probe().then(function (ok) {
    if (ok) {
      state.textContent = "统一后台可访问，正在跳转…";
      setTimeout(jump, 1200);
    } else {
      dot.className = "dot bad";
      state.textContent = "暂时无法连通统一后台（域名解析失败或服务未启动），请稍后重试或点击上方按钮。";
    }
  });
})();
</script>
</body>
</html>
